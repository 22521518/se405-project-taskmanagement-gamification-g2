query GetMessagesByConversation($conversationId: ID!) {
    getMessagesByConversation(conversationId: $conversationId) {
        uuid
        content
        type
        fileUrl
        fileName
        fileSize
        createdAt
        conversationId
        sender {
            uuid
            displayName
            avatarUrl
            email
        }
        replyTo {
            uuid
            content
            sender {
                displayName
            }
        }
    }
}