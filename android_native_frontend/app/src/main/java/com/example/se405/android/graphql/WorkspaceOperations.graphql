query GetWorkspaceActivities($uuid: ID!, $pagination: PaginationInput) {
  getWorkspaceActivities(uuid: $uuid, pagination: $pagination) {
    content {
      status
      taskCompletionId
      completedAt
      task {
        uuid
        priority
        title
      }
      user {
        uuid
        displayName
      }
    }
    pageInfo {
      totalElements
      totalPages
      pageSize
      currentPage
      hasNext
      hasPrevious
    }
  }
}