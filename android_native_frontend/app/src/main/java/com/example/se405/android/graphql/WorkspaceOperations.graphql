query GetUsersExcluding($excludedUserId: ID!) {
  getUsersExcluding(excludeUserId: $excludedUserId) {
    uuid
    username
    displayName
    email
    avatarUrl
  }
}

mutation AddMembersToWorkspace($workspaceId: ID!, $userIds: [ID!]!, $role: WorkspaceRole!) {
  addMembersToWorkspace(workspaceId: $workspaceId, userIds: $userIds, role: $role) {
    workspaceId
    userId
    role
    joinedAt
    user {
      uuid
      username
      displayName
      avatarUrl
      email
    }
  }
}

mutation AddMembersToProject($projectId: ID!,$userIds: [ID!]!) {
  addMembersToProject(projectId: $projectId, userIds: $userIds) {
    projectId
    workspaceId
    userId
    joinedAt
    user {
      uuid
      username
      displayName
      avatarUrl
      email
    }
  }
}

mutation AddMemberToWorkspace($workspaceId: ID!, $userId: ID!, $role: WorkspaceRole!) {
  addMemberToWorkspace(workspaceId: $workspaceId, userId: $userId, role: $role) {
