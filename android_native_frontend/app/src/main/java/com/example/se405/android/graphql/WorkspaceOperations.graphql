mutation CreateProject($input: CreateProjectInput!) {
  createProject(input: $input) {
    uuid
    name,
    workspaceId,
    members {
      user {
        uuid,
        displayName,
        username,
        avatarUrl,
      }
      joinedAt,
    }
    createdAt
    tasks {
      type
      uuid,
      priority
      creator {
        uuid,
        displayName,
        avatarUrl
      }
      title
      repetition
      description
      projectId
      status
      taskCompletionLogs {
        userId,
        taskCompletionId,
        status,
        completedAt
      }
      startDate
      dueDate
      assignees {
        userId
        user {
          uuid
          username
          displayName
          email
          avatarUrl
        }
      }
    }
  }
}

mutation CreateWorkspace($input: CreateWorkspaceInput!) {
  createWorkspace(input: $input) {
    uuid
    name
    owner {
      uuid
      username
      displayName
      avatarUrl
    }
  }
}

query GetProject($uuid: ID!) {
  getProject(uuid: $uuid) {
    uuid
    name,
    workspaceId,
    members {
      user {
        uuid,
        displayName,
        email
        username,
        avatarUrl,
      }
      joinedAt,
    }
    createdAt
    tasks {
      type
      uuid,
      priority
      creator {
        uuid,
        displayName,
        avatarUrl
      }
      title
      repetition
      description
      tags {
        uuid
        color
        name
        label {
          uuid
          description
          name
        }
        ownershipType
        workspaceId
        createdBy
      }
      projectId
      status
      taskCompletionLogs {
        userId,
        taskCompletionId,
        status,
        completedAt
      }
      startDate
      dueDate
      assignees {
        userId
        user {
          uuid
          username
          displayName
          email
          avatarUrl
        }
      }
    }
  }
}

query GetWorkspaceListByUserId($uuid: ID!) {
  getWorkspaceListByUserId(userId: $uuid) {
    uuid
    name
    members {
      userId
      user {
        username
        displayName
        email
        avatarUrl
      }
      role
      joinedAt
    }
    owner {
      username
      uuid
      displayName
    }
    projects {
      uuid
      name
      members {
        userId
        user {
          username
          displayName
          email
          avatarUrl
        }
        joinedAt
      }
    }
  }
}

query GetWorkspace($uuid: ID!) {
  getWorkspace(uuid: $uuid) {
    uuid
    name
    projects {
      uuid
      name
      createdAt
      workspaceId
      members {
        userId
        user {
          username
          email
          avatarUrl
          displayName
        }
      }
      tasks {
        uuid
        type
        title
        description
        startDate
        dueDate
        priority
        tags {
          uuid
          name
          color
          ownershipType
          workspaceId
          label {
            uuid
            name
            description
          }
        }
        status
        taskCompletionLogs {
          status
        }
        assignees {
          userId
          user {
            uuid
            username
            displayName
            email
            avatarUrl
          }
        }
      }
    }
    members {
      workspaceId
      userId
      role
      joinedAt
      user {
        uuid
        username
        displayName
        avatarUrl
        email
      }
    }
  }
}

