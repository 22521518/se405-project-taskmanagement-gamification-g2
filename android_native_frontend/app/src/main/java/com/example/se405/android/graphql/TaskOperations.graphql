query GetTaskCompletionLogs($taskId: ID!) {
  getTaskCompletionLogs(taskId: $taskId) {
    taskCompletionId
    taskId
    userId
    date
    completedAt
  }
}

mutation CreateTask($input: CreateTaskInput!) {
  createTask(input: $input) {
    uuid
    title
    description
    repetition
    type
    status
    priority
    projectId
    startDate
    dueDate
    creator {
      uuid
      username
      email
      displayName
      avatarUrl
      createdAt
      updatedAt
    }
    assignees {
      userId
      user {
        uuid
        username
        displayName
        email
        avatarUrl
      }
    }
  }
}

mutation UpdateTask($input: UpdateTaskInput!) {
  updateTask(input: $input) {
    uuid
    title
    description
    repetition
    type
    status
    priority
    projectId
    startDate
    dueDate
    assignees {
      userId
      user {
        uuid
        username
        displayName
        email
        avatarUrl
      }
    }
  }
}

mutation DeleteTask($uuid: ID!) {
  deleteTask(uuid: $uuid) {
    uuid
  }
}

mutation MarkTaskDone($input: MarkTaskDoneInput!) {
  markTaskDone(input: $input) {
    taskCompletionId
    taskId
    userId
    date
    completedAt
