query GetTasks($userId: ID!) {
  getTasks(userId: $userId) {
    uuid
    title
    description
    repetition
    type
    status
    priority
    projectId
    startDate
    dueDate
    creator {
      uuid
      username
      email
      displayName
      avatarUrl
      createdAt
      updatedAt
    }
    tags {
      uuid
      name
      color
      ownershipType
      workspaceId
      label {
        uuid
        name
        description
      }
    }
    taskCompletionLogs {
      taskCompletionId
      taskId
      userId
      date
      completedAt
    }
    assignees {
      userId
      user {
        uuid
        username
        displayName
        email
        avatarUrl
      }
    }
  }
}

