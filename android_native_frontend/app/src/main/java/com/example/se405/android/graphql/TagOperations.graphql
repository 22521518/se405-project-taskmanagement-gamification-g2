query GetTagsByWorkspace($workspaceId: ID!) {
  getTagsByWorkspace(workspaceId: $workspaceId) {
    uuid
    name
    color
    ownershipType
    workspaceId
    createdBy
    createdAt
    updatedAt
    creator {
      uuid
      username
      email
      displayName
      avatarUrl
      createdAt
      updatedAt
    }
    tasks {
      uuid
      title
      status
      priority
      projectId
      startDate
      dueDate
    }
  }
}

