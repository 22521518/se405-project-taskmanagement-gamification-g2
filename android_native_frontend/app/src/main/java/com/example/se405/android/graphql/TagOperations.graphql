mutation CreateTag($input: CreateTagInput!) {
  createTag(input: $input) {
    uuid
    name
    color
    ownershipType
    workspaceId
    createdBy
    createdAt
    updatedAt
    creator {
      uuid
      username
      email
      displayName
      avatarUrl
      createdAt
      updatedAt
    }
  }
}

mutation UpdateTag($input: UpdateTagInput!) {
  updateTag(input: $input) {
    uuid
    name
    color
    ownershipType
    workspaceId
    createdBy
    createdAt
    updatedAt
    creator {
      uuid
      username
      email
      displayName
      avatarUrl
      createdAt
      updatedAt
    }
  }
}

mutation DeleteTag($uuid: ID!) {
  deleteTag(uuid: $uuid) {
    uuid
  }
}
