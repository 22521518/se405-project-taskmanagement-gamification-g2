mutation SendMessage($conversationId: ID!, $content: String!, $replyToId: ID) {
    sendMessage(conversationId: $conversationId, content: $content, replyToId: $replyToId) {
        uuid
        content
        createdAt
        conversationId
        sender {
            uuid
            displayName
            avatarUrl
            email
        }
        replyTo {
            uuid
            content
            sender {
                displayName
            }
        }
    }
}