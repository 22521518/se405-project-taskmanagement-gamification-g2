mutation SendMessage(
    $conversationId: ID!,
    $content: String!,
    $replyToId: ID,
    $type: MessageType!,
    $fileUrl: String,
    $fileName: String,
    $fileSize: String,
    $mentionedUserIds: [ID!]
) {
    sendMessage(
        conversationId: $conversationId,
        content: $content,
        replyToId: $replyToId,
        type: $type,
        fileUrl: $fileUrl,
        fileName: $fileName,
        fileSize: $fileSize,
        mentionedUserIds: $mentionedUserIds
    ) {
        uuid
        content
        type
        fileUrl
        fileName
        fileSize
        createdAt
        conversationId
        isRevoked
        isPinned
        pinnedAt
        sender {
            uuid
            displayName
            avatarUrl
            email
            isOnline
        }
        replyTo {
            uuid
            content
            sender {
                displayName
            }
        }
    }
}